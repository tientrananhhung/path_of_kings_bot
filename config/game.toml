[[rule]]
name = "PVP RAID -> swipe trái (Run)"
enabled = true
priority = 2
cooldown_s = 3
enters_ad = false

[rule.when]
kind = "text"
contains = "raid"

[rule.do]
action = "swipe"
from = [
    0.5,
    0.78,
]
to = [
    0.05,
    0.78,
]
