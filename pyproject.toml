[project]
name = "pok"
version = "0.1.0"
description = "Bot Path of Kings — macOS + iPhone Mirroring"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyobjc-framework-Quartz>=10",
  "pyobjc-framework-Cocoa>=10",
  "pyobjc-framework-Vision>=10",
  "pyobjc-framework-ApplicationServices>=10",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",     # uvicorn cần package này mới xử lý WebSocket upgrade,
                        # thiếu nó thì /ws trả 404 chứ không báo lỗi gì
  "tomli-w>=1.0",
]

[project.optional-dependencies]
# AGPL-3.0. Chỉ cần khi bật bước 2c ([yolo] trong config/ads.toml).
# KHÔNG kéo theo torch mới: nó chỉ đòi torch>=1.8, đã có sẵn 2.13 cho Florence-2.
# Cài kèm --no-deps rồi cài tay phần còn lại nếu muốn giữ opencv-python-headless:
#   ./.venv/bin/pip install --no-deps ultralytics ultralytics-thop ultralytics-platform
#   ./.venv/bin/pip install matplotlib polars psutil requests nvidia-ml-py
yolo = ["ultralytics>=8.4"]
vlm = ["torch>=2.2", "transformers>=5.16", "einops", "timm"]
dev = ["pytest>=8"]

[project.scripts]
pok = "pok.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pok.ui" = ["static/*"]
